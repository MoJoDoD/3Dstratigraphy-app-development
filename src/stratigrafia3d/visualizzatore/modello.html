<title>Stratigrafia 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: strumento a schermo pieno — elenco US a sinistra, scena 3D al centro, scheda US a destra.
   Linguaggio visivo della documentazione di scavo: carta da rilievo, inchiostro, rosso delle linee di sezione. */
:root{
  --paper:#e9ece8; --panel:#f7f8f5; --panel-2:#eef1ed; --ink:#1c2226; --muted:#5a656a; --line:#cdd4cf;
  --accent:#c4321c; --accent-soft:#c4321c22; --on-accent:#ffffff; --scene:#dde2dd; --scene-2:#c9d0ca;
  --gold:#d9a400; --good:#2f7d5b;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-read:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121618; --panel:#191e21; --panel-2:#20262a; --ink:#e3e7e4; --muted:#96a1a4; --line:#2d353a;
  --accent:#ff6a4f; --accent-soft:#ff6a4f2a; --on-accent:#1a0d09; --scene:#0f1315; --scene-2:#1a2023;
  --gold:#f2c230; --good:#5fc193; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121618; --panel:#191e21; --panel-2:#20262a; --ink:#e3e7e4; --muted:#96a1a4; --line:#2d353a;
  --accent:#ff6a4f; --accent-soft:#ff6a4f2a; --on-accent:#1a0d09; --scene:#0f1315; --scene-2:#1a2023;
  --gold:#f2c230; --good:#5fc193; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:17px;font-weight:700;letter-spacing:.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);padding:2px 7px;border-radius:3px;white-space:nowrap}
.hsp{flex:1}
.hbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r);padding:5px 10px;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--muted)}
.hbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.main{display:grid;grid-template-columns:268px minmax(0,1fr) 392px;min-height:0}
.main.nopanel{grid-template-columns:268px minmax(0,1fr) 0}

/* --- elenco US --- */
aside.list{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.list .search{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px}
.list input[type=search]{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:6px 8px}
.tree{overflow:auto;padding:4px 0 16px}
.phase{border-bottom:1px solid var(--line)}
.phase-h{display:flex;align-items:center;gap:8px;padding:8px 12px 6px;position:sticky;top:0;background:var(--panel);z-index:1}
.phase-h .sw{width:10px;height:10px;border-radius:2px;flex:none}
.phase-h b{font-weight:600;font-size:13px}
.phase-h small{color:var(--muted);font-size:11.5px;margin-left:auto;font-family:var(--f-num)}
.phase-h input{margin:0}
.unit{display:grid;grid-template-columns:16px 14px 44px 1fr;align-items:center;gap:6px;padding:3px 12px 3px 14px;cursor:pointer;font-size:13px}
.unit:hover{background:var(--panel-2)}
.unit.sel{background:var(--accent-soft)}
.unit .n{font-family:var(--f-num);font-size:12px}
.unit .d{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .c{width:12px;height:12px;border-radius:2px;border:1px solid #0003}
.unit .c.neg{background:transparent!important;border:1.5px dashed var(--ink)}
.unit input{margin:0}

/* --- scena --- */
.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 40%,var(--scene),var(--scene-2))}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tools{position:absolute;left:12px;top:12px;right:70px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.tools.bottom{top:auto;bottom:58px;right:auto;max-width:calc(100% - 250px)}
.tool{pointer-events:auto;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px);box-shadow:0 1px 3px #0000001a}
.tool label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap}
.tool output{font-family:var(--f-num);font-size:12px;min-width:3.8em;text-align:right}
.tool input[type=range]{width:92px;accent-color:var(--accent)}
.tool select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:3px 4px;font-size:12.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:3px 8px;cursor:pointer;font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.excav-note{position:absolute;left:12px;bottom:12px;max-width:min(560px,calc(100% - 140px));font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px}
.excav-note b{color:var(--ink);font-weight:600}
.legend{position:absolute;right:12px;bottom:12px;max-width:210px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:12px;max-height:44%;overflow:auto;display:grid;gap:3px;min-width:150px}
.legend h4{margin:0 0 3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.legend div{display:flex;gap:7px;align-items:center}
.legend i{width:12px;height:12px;border-radius:2px;flex:none}
.compass{position:absolute;right:14px;top:62px;width:46px;height:46px;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;padding:4px 7px;border-radius:4px;transform:translate(10px,10px);white-space:nowrap;z-index:5}
.lbl{position:absolute;transform:translate(-50%,-100%);font-family:var(--f-num);font-size:10px;padding:1px 4px;border-radius:3px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);pointer-events:none;white-space:nowrap}
.lbl.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#labels{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}

/* --- pannello scheda --- */
aside.panel{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;font-size:13.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:16px 18px 28px;min-height:0;flex:1}
.empty{color:var(--muted);font-family:var(--f-read);font-size:14.5px;line-height:1.55}
.empty ul{padding-left:18px}
.sh{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:end;margin-bottom:10px}
.sh .num{font-family:var(--f-num);font-size:36px;font-weight:500;line-height:1;grid-row:span 2}
.sh .kind{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sh h2{font-size:19px;margin:0;font-weight:600;text-wrap:balance;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;display:inline-flex;gap:6px;align-items:center;background:var(--panel-2)}
.chip i{width:9px;height:9px;border-radius:50%}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.acts button{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r);padding:4px 10px;cursor:pointer;font-size:12.5px}
.acts button:hover{border-color:var(--muted)}
.acts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
details.sec{border-top:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
details.sec>summary::-webkit-details-marker,details.sub>summary::-webkit-details-marker{display:none}
details.sec>summary::before,details.sub>summary::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details[open]>summary::before{transform:rotate(45deg)}
details.sec>summary small{margin-left:auto;font-weight:400;color:var(--muted);font-family:var(--f-num);font-size:12px}
.sec-b{padding:0 0 14px}
.read{font-family:var(--f-read);font-size:14.5px;line-height:1.55;margin:0 0 8px;max-width:62ch}
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.kv dd.m{font-family:var(--f-num);font-size:12.5px}
.rel{display:grid;grid-template-columns:118px 1fr;gap:6px 10px;font-size:13px;align-items:baseline}
.rel dt{color:var(--muted)}
.rel dd{margin:0;display:flex;flex-wrap:wrap;gap:4px}
.ulink{font-family:var(--f-num);font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:1px 6px;cursor:pointer}
.ulink:hover{border-color:var(--accent);color:var(--accent)}
details.sub{border:1px solid var(--line);border-radius:var(--r);margin:0 0 6px;background:var(--paper)}
details.sub>summary{list-style:none;cursor:pointer;padding:7px 10px;display:flex;align-items:center;gap:8px;font-size:13.5px}
details.sub>summary span{flex:1;min-width:0}
details.sub>summary small{font-family:var(--f-num);font-size:11.5px;color:var(--muted);white-space:nowrap}
.mt{width:100%;border-collapse:collapse;font-size:12.5px}
.mt th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-top:1px solid var(--line)}
.mt td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:top}
.mt td.r,.mt th.r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.rs{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-bottom:6px;background:var(--paper);display:grid;gap:3px;cursor:pointer}
.rs:hover{border-color:var(--gold)}
.rs b{font-family:var(--f-num);font-weight:500;font-size:12px}
.rs p{margin:0;font-family:var(--f-read);font-size:13.5px;line-height:1.45}
.rs small{color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}

/* harris / sezioni */
.hwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.hwrap svg text{font-family:var(--f-num)}
.hnode{cursor:pointer}
.hnode rect{stroke:var(--ink);stroke-width:1}
.hnode.sel rect{stroke:var(--accent);stroke-width:2.5}
.hnode text{fill:var(--ink);font-size:10.5px}
.hedge{stroke:var(--muted);stroke-width:1;fill:none}
.hsame{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2}
.spoly{cursor:pointer;stroke:#00000055;stroke-width:.6}
.spoly.sel{stroke:var(--accent);stroke-width:2}
.slbl{font-family:var(--f-num);font-size:9px;fill:#111;pointer-events:none}
.axis{stroke:var(--line)}
.axt{fill:var(--muted);font-size:9.5px;font-family:var(--f-num)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row label{font-size:12px;color:var(--muted)}

/* telefono */
.mobile-only{display:none}
@media (max-width:900px){
  .main,.main.nopanel{grid-template-columns:minmax(0,1fr)}
  aside.list{position:absolute;z-index:20;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .2s;box-shadow:4px 0 16px #0003}
  aside.list.open{transform:none}
  aside.panel{position:absolute;z-index:19;left:0;right:0;bottom:0;height:52%;border-left:0;border-top:1px solid var(--line);box-shadow:0 -4px 16px #0002}
  .main.nopanel aside.panel{display:none}
  .main{position:relative}
  .mobile-only{display:inline-flex}
  .brand,.tag{display:none}
  .tool input[type=range]{width:80px}
  .legend{display:none}
  .tools{display:none}
  .stage.tools-open .tools{display:flex;right:12px}
  .tools.bottom{max-width:none;bottom:12px}
  .stage.tools-open .excav-note{display:none}
  .brand h1{font-size:15px}
  .excav-note{max-width:calc(100% - 24px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <button class="hbtn mobile-only" id="btnList" aria-label="Elenco delle US">US</button>
    <div class="brand"><h1 id="titolo">Scavo</h1><span>Visualizzatore stratigrafico 3D</span></div>
    <span class="tag" id="tagDemo" title="Scavo e dati inventati per dimostrazione" hidden>Dati immaginari</span>
    <div class="hsp"></div>
    <div class="seg" role="group" aria-label="Vista">
      <button id="v3d" aria-pressed="true">3D</button><button id="vtop" aria-pressed="false">Pianta</button>
    </div>
    <button class="hbtn mobile-only" id="btnTools" aria-pressed="false">Strumenti</button>
    <button class="hbtn" id="btnPanel" aria-pressed="true">Scheda</button>
  </header>
  <div class="main" id="main">
    <aside class="list" id="list">
      <div class="search"><input type="search" id="q" placeholder="Cerca US, USM o definizione" aria-label="Cerca"><button class="hbtn" id="btnAll" title="Mostra tutte">Tutte</button></div>
      <div class="tree" id="tree"></div>
    </aside>
    <section class="stage" id="stage">
      <canvas id="c3d" aria-label="Modello 3D delle unità stratigrafiche"></canvas>
      <div id="labels"></div>
      <div class="loading" id="loading">Caricamento del modello…</div>
      <div class="tools">
        <div class="tool"><label for="expl">Esploso</label><input type="range" id="expl" min="0" max="0.6" step="0.01" value="0.3"><output id="explO">30 cm</output>
          <select id="explMode" aria-label="Ordine dell'esploso"><option value="fase">per fase</option><option value="lev">per sequenza</option></select></div>
        <div class="tool"><label for="exc">Scavo virtuale</label><input type="range" id="exc" min="0" max="10" step="1" value="0"><output id="excO"></output></div>
        <div class="tool"><label for="ve">Esag. vert.</label><input type="range" id="ve" min="1" max="6" step="0.5" value="2.5"><output id="veO">×2.5</output></div>
        <div class="tool"><label for="clipAx">Sezione</label>
          <select id="clipAx" aria-label="Piano di sezione"><option value="">nessuna</option><option value="x">N-S libera</option><option value="y">E-O libera</option></select>
          <input type="range" id="clipPos" min="0" max="20" step="0.05" value="10" aria-label="Posizione del piano"><output id="clipO"></output>
          <button class="hbtn" id="clipFlip" title="Inverti il lato conservato">⇄</button></div>
      </div>
      <div class="tools bottom">
        <div class="tool"><label for="colMode">Colore</label>
          <select id="colMode"><option value="mun">sedimento (Munsell)</option><option value="fase">fase</option><option value="cat">categoria</option><option value="aff">affidabilità</option></select></div>
        <div class="tool"><label>Mostra</label>
          <div class="seg" role="group" aria-label="Sovrapposizioni">
            <button id="oLbl" aria-pressed="true" title="Numeri di US">N.</button><button id="oEdge" aria-pressed="true" title="Spigoli">Spigoli</button><button id="oQ" aria-pressed="false" title="Quote rilevate">Quote</button><button id="oP" aria-pressed="false" title="Profili rilevati in sezione">Profili</button><button id="oRS" aria-pressed="true" title="Reperti speciali e campioni">RS</button><button id="oCut" aria-pressed="true" title="Superfici di taglio">Tagli</button>
          </div></div>
      </div>
      <svg class="compass" id="compass" viewBox="-25 -25 50 50" aria-hidden="true"><circle r="22" fill="var(--panel)" stroke="var(--line)"/><g id="needle"><path d="M0,-17 L5,2 L0,-2 L-5,2 Z" fill="var(--accent)"/><text y="-19" text-anchor="middle" font-size="8" fill="var(--ink)" font-family="IBM Plex Sans Condensed,Arial" font-weight="700">N</text></g></svg>
      <div class="excav-note" id="excNote"></div>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip" hidden></div>
    </section>
    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tScheda" aria-selected="true">Scheda</button>
        <button role="tab" id="tHarris" aria-selected="false">Harris</button>
        <button role="tab" id="tSez" aria-selected="false">Sezioni</button>
      </div>
      <div class="pbody" id="pScheda"></div>
      <div class="pbody" id="pHarris" hidden></div>
      <div class="pbody" id="pSez" hidden></div>
    </aside>
  </div>
</div>

<script type="application/json" id="modello">/*__DATA__*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.getElementById(s);
const D=JSON.parse($("modello").textContent);
const EXT=D.estensione||[0,0,20,16];           // estensione in pianta (coordinate locali, m)
const CX=(EXT[0]+EXT[2])/2, CY=(EXT[1]+EXT[3])/2;  // centro della scena
const QU=D.quant||0.001;                         // passo delle coordinate intere
const DIAG=Math.hypot(EXT[2]-EXT[0],EXT[3]-EXT[1]);
const ORIG=D.origine;
const S=D.schede;                  // schede per numero
$("titolo").textContent=D.sito||"Scavo"; document.title=(D.sito||"Scavo")+" – Stratigrafia 3D"; $("tagDemo").hidden=!D.demo;
const FASI={}; D.fasi.forEach(f=>FASI[f.Fase]=f);
const PH_COL=["#8e8a7c","#5c7196","#6f8f45","#b88a2c","#a8573a","#7b4b86","#cf6e4f","#2f8580","#6d6659"];
const CAT_COL={"strato":"#a88b62","crollo":"#c0694d","riempimento":"#4f4237","taglio":"#222222","piano pavimentale":"#c58f7e","preparazione":"#bdb2a0","focolare":"#d0622f","struttura":"#a2553a","muro":"#c9c2b4","canaletta":"#8f9aa3","soglia":"#9aa29b"};
// fasi e categorie oltre quelle previste: colori generati (angolo aureo), stabili tra un'apertura e l'altra
{const hsl=(h,sa,l)=>{const f=n=>{const k=(n+h/30)%12,a=sa*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,"0")};return "#"+f(0)+f(8)+f(4)};
 const fasi=new Set([...D.fasi.map(f=>+f.Fase),...Object.values(S).map(r=>+r.Fase||0)]);
 const maxF=Math.max(0,...[...fasi].filter(Number.isFinite));
 for(let i=PH_COL.length;i<=maxF;i++) PH_COL.push(hsl((i*137.5+20)%360,.42,.47));
 const cats=[...new Set(Object.values(S).map(r=>r.Categoria).filter(c=>c!=null&&c!==""))].sort();
 let k=0; cats.forEach(c=>{ if(!CAT_COL[c]) CAT_COL[c]=hsl((k++*137.5+200)%360,.38,.5) });}
const AFF_COL={misurata:"#2f7d5b",profondita:"#5f8f3f",impilata:"#c09a2c",schematica:"#c0573a",nessuna:"#8a8a8a"};
const AFF_TXT={misurata:"misurata: quote o profili rilevati",profondita:"da superficie e profondità",impilata:"impilata nella sequenza, spessore in scheda",schematica:"schematica: valori tipici",nessuna:"non ricostruita"};

function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
const V=(x,y,z)=>new THREE.Vector3(x-CX,z,-(y-CY));

function colorFor(u){
  const mode=$("colMode").value;
  if(mode==="fase") return PH_COL[faseOf(u)]||"#888";
  if(mode==="cat") return CAT_COL[catOf(u)]||"#999";
  if(mode==="aff") return AFF_COL[affOf(u)]||"#999";
  const s=S[u]; if(s&&/^#[0-9a-f]{6}$/i.test(String(s["Colore HEX"]||""))) return s["Colore HEX"];
  if(s&&s._tipo==="USM") return "#c9c2b4";
  return CAT_COL[catOf(u)]||PH_COL[faseOf(u)]||"#9a8f80";   // nessun colore in scheda: per categoria o fase
}

D.meshes.forEach(m=>{
  const P=new Uint16Array(b64(m.pos)), I=m.i32?new Uint32Array(b64(m.idx)):new Uint16Array(b64(m.idx));
  const pos=new Float32Array(P.length);
  for(let i=0;i<P.length;i+=3){pos[i]=P[i]*QU-CX;pos[i+1]=P[i+2]*QU;pos[i+2]=-(P[i+1]*QU-CY)}
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setIndex(new THREE.BufferAttribute(I,1));
  g.computeVertexNormals(); g.computeBoundingSphere();
  const grp=new THREE.Group(); grp.userData.id=m.id;
  const isCut=m.kind==="taglio";
  const col=new THREE.Color(colorFor(m.id));
  const front=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:col,roughness:.92,metalness:0,side:isCut?THREE.DoubleSide:THREE.FrontSide,
      transparent:isCut,opacity:isCut?.28:1,depthWrite:!isCut,clippingPlanes:[],polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
  front.userData.id=m.id; grp.add(front);
  let back=null;
  if(!isCut){ // faccia interna piatta: appare come campitura quando si seziona
    back=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:col.clone().multiplyScalar(.9),side:THREE.BackSide,clippingPlanes:[]}));
    grp.add(back);
  }
  const eg=new THREE.EdgesGeometry(g,32);
  const edges=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x1c2226,transparent:true,opacity:isCut?.55:.28,clippingPlanes:[]}));
  grp.add(edges);
  world.add(grp);
  units[m.id]={grp,front,back,edges,def:m,visible:true,cut:isCut,extra:[]};
});

// quote, profili, reperti agganciati alle rispettive unità (seguono l'esploso)
(function overlays(){
  const Q=new Float32Array(b64(D.quote.xyz));
  const byU={};
  D.quote.meta.forEach(([u,t],i)=>{(byU[u]??=[]).push([Q[i*3],Q[i*3+1],Q[i*3+2],t])});
  const qcol={sup:0x111111,inf:0x2b63d9,taglio:0xd43a2a,orlo:0xd43a2a,rasatura:0x6b6b6b,fondazione:0x2b63d9};
  Object.entries(byU).forEach(([u,arr])=>{
    const U=units[u]; if(!U) return;
    const p=new Float32Array(arr.length*3), c=new Float32Array(arr.length*3);
    arr.forEach((a,i)=>{const v=V(a[0],a[1],a[2]);p.set([v.x,v.y,v.z],i*3);const k=new THREE.Color(qcol[a[3]]??0);c.set([k.r,k.g,k.b],i*3)});
    const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(p,3)); g.setAttribute("color",new THREE.BufferAttribute(c,3));
    const pts=new THREE.Points(g,new THREE.PointsMaterial({size:5,sizeAttenuation:false,vertexColors:true,clippingPlanes:[]}));
    pts.userData.kind="quote"; pts.visible=false; U.grp.add(pts); U.extra.push(pts);
  });
  D.profili.forEach(pr=>{
    const U=units[pr.us]; if(!U) return;
    const pts=[]; for(let i=0;i<pr.c.length;i+=3) pts.push(V(pr.c[i],pr.c[i+1],pr.c[i+2]));
    const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:pr.t==="inf"?0x2b63d9:(pr.t==="taglio"?0xd43a2a:0x111111),clippingPlanes:[]}));
    l.userData.kind="profilo"; l.visible=false; U.grp.add(l); U.extra.push(l);
  });
  const oct=new THREE.OctahedronGeometry(.07);
  D.rs.forEach(r=>{const U=units[r.US]; if(!U) return;
    const m=new THREE.Mesh(oct,new THREE.MeshStandardMaterial({color:0xe0a800,emissive:0x553300,roughness:.4,clippingPlanes:[]}));
    const v=V(...r._xyz); m.position.copy(v); m.userData={kind:"rs",rs:r.RS,id:r.US}; U.grp.add(m); U.extra.push(m)});
  const hexg=new THREE.CylinderGeometry(.06,.06,.05,6);
  D.campioni.forEach(r=>{const U=units[r.US]; if(!U) return;
    const m=new THREE.Mesh(hexg,new THREE.MeshStandardMaterial({color:0x13a37a,roughness:.5,clippingPlanes:[]}));
    m.position.copy(V(...r._xyz)); m.userData={kind:"rs",id:r.US}; U.grp.add(m); U.extra.push(m)});
})();

// riferimenti: limite di scavo, saggio, tracce delle sezioni, griglia 2 m
const ref=new THREE.Group(); scene.add(ref);
const refMat=c=>new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.8});
function refBuild(){
  ref.clear();
  const zBase=D.demo?.7:0;
  D.limiti.forEach(l=>{const pts=[];for(let i=0;i<l.c.length;i+=2)pts.push(V(l.c[i],l.c[i+1],l.tipo==="saggio"?zBase+.02:zBase));
    ref.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),refMat(l.tipo==="saggio"?0xc4321c:0x3a3a3a)))});
  const gp=[];
  // griglia di riferimento: 2 m per scavi piccoli, 5 o 10 m per aree grandi
  const est=Math.max(EXT[2]-EXT[0],EXT[3]-EXT[1]), g=est<=40?2:est<=150?5:10;
  const x0=Math.floor(EXT[0]/g)*g, x1=Math.ceil(EXT[2]/g)*g, y0=Math.floor(EXT[1]/g)*g, y1=Math.ceil(EXT[3]/g)*g;
  for(let x=x0;x<=x1+1e-6;x+=g) gp.push(V(x,y0,zBase),V(x,y1,zBase));
  for(let y=y0;y<=y1+1e-6;y+=g) gp.push(V(x0,y,zBase),V(x1,y,zBase));
  const gl=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(gp),new THREE.LineBasicMaterial({color:0x8a918c,transparent:true,opacity:.35}));
  ref.add(gl);
  D.sezioni.forEach(s=>{const a=V(s.a[0],s.a[1],zBase),b=V(s.b[0],s.b[1],zBase);
    ref.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineDashedMaterial({color:0xc4321c,dashSize:.25,gapSize:.15})).computeLineDistances())});
}
refBuild();

let GHOST=true, VE=2.5, GAP=0.3, EXPL_MODE="fase", EXC=0, selected=null, isolated=false, hidden=new Set();
const LEVMAX=D.livello_max;
// profondità "dall'alto": numero massimo di unità sovrastanti (ordine di asportazione)
const TOPD={}; (function(){
  const pred={}; D.rapporti.forEach(([a,t,b])=>{ if(t!=="si lega a") (pred[b]??=[]).push(a) });
  const memo=u=>{ if(TOPD[u]!=null) return TOPD[u]; TOPD[u]=0; const p=pred[u]||[]; TOPD[u]=p.length?1+Math.max(...p.map(memo)):0; return TOPD[u] };
  Object.keys(S).forEach(u=>memo(+u));
})();
const EXCMAX=Math.max(...Object.keys(S).filter(u=>S[u]._tipo!=="USM").map(u=>TOPD[u]))+1;
const removedAt=u=>S[u]._tipo!=="USM" && TOPD[u]<EXC;
function explIndex(u){ if(EXPL_MODE==="fase") return faseOf(u)*2 + (S[u]?._tipo==="USM"? .5:0); return S[u]?._livello??0 }
function applyLayout(){
  Object.entries(units).forEach(([u,U])=>{
    U.grp.scale.y=VE; U.grp.position.y=explIndex(+u)*GAP;
  });
  ref.scale.y=VE;
  updateVisibility();
}
function updateVisibility(){
  const removed=[];
  Object.entries(units).forEach(([u,U])=>{
    const exc=removedAt(+u);
    if(exc) removed.push(+u);
    let vis=!hidden.has(+u) && !exc;
    if(isolated && selected!=null) vis = (+u===selected);
    if(U.cut && !$("oCut").matches('[aria-pressed="true"]')) vis=vis && (+u===selected);
    U.grp.visible=vis; U.visible=vis;
  });
  const lab=$("excO"); lab.textContent=EXC===0?"nessuno":EXC+"/"+EXCMAX;
  const note=$("excNote");
  if(EXC>0){ removed.sort((a,b)=>(TOPD[a]-TOPD[b])||a-b);
    note.innerHTML="<b>Scavo virtuale, passo "+EXC+" di "+EXCMAX+"</b>: asportate "+removed.length+" US nell'ordine della sequenza ("+removed.slice(0,16).join(", ")+(removed.length>16?"…":"")+"). Le murature restano in posto.";
  } else note.innerHTML="<b>Clic</b> su un'unità per aprirne la scheda · trascina per ruotare · rotella per lo zoom · tasto destro per spostare";
  syncTree();
}
function applyColors(){
  Object.entries(units).forEach(([u,U])=>{const c=new THREE.Color(colorFor(+u));U.front.material.color.copy(c); if(U.back) U.back.material.color.copy(c.clone().multiplyScalar(.9))});
  buildLegend(); syncTree(true);
}
function applyClip(){
  Object.values(units).forEach(U=>{
    [U.front,U.back,U.edges,...U.extra].forEach(o=>{if(o&&o.material) {o.material.clippingPlanes=clipArr(); o.material.needsUpdate=true}});
  });
}
function highlight(){
  Object.entries(units).forEach(([u,U])=>{
    const on=+u===selected;
    const ghost=GHOST && selected!=null && !on && !clipOn;
    const fm=U.front.material;
    fm.transparent=U.cut||ghost; fm.opacity=U.cut?(on?.6:(ghost?.12:.28)):(ghost?.16:1); fm.depthWrite=!(U.cut||ghost);
    if(U.back) U.back.visible=!ghost;
    fm.needsUpdate=true;
    U.front.material.emissive=new THREE.Color(on?css("--accent")||"#c4321c":"#000");
    U.front.material.emissiveIntensity=on?.55:0;
    U.edges.material.color.set(on?(css("--accent")||"#c4321c"):"#1c2226");
    U.edges.material.opacity=on?.95:(ghost?.07:(U.cut?.55:.28));
  });
}

function buildTree(){
  const byF={};
  Object.keys(S).map(Number).forEach(u=>{if(units[u]) (byF[faseOf(u)]??=[]).push(u)});
  const t=$("tree"); t.innerHTML="";
  Object.keys(byF).map(Number).sort((a,b)=>b-a).forEach(f=>{
    const F=FASI[f]||{Titolo:"Fase "+f}; const list=byF[f].sort((a,b)=>a-b);
    const d=document.createElement("div"); d.className="phase";
    d.innerHTML=`<div class="phase-h"><input type="checkbox" checked aria-label="Mostra fase ${f}" data-f="${f}"><i class="sw" style="background:${PH_COL[f]}"></i><b>${f} · ${esc(F.Titolo)}</b><small>${F["Da (anno)"]!=null?esc(fmtY(F["Da (anno)"]))+"–"+esc(fmtY(F["A (anno)"])):""}</small></div>`+
      list.map(u=>`<div class="unit" data-u="${u}"><input type="checkbox" checked aria-label="Mostra ${u}" data-u="${u}"><i class="c${S[u].Tipo==="negativa"?" neg":""}" data-c="${u}"></i><span class="n">${S[u]._tipo==="USM"?"USM ":""}${u}</span><span class="d">${esc(defOf(u))}</span></div>`).join("");
    t.appendChild(d);
  });
  t.addEventListener("change",e=>{
    const el=e.target; if(el.dataset.f!=null){const f=+el.dataset.f; byF[f].forEach(u=>el.checked?hidden.delete(u):hidden.add(u))}
    else if(el.dataset.u){const u=+el.dataset.u; el.checked?hidden.delete(u):hidden.add(u)}
    isolated=false; updateVisibility(); renderScheda();
  });
  t.addEventListener("click",e=>{const r=e.target.closest(".unit"); if(!r||e.target.tagName==="INPUT") return; select(+r.dataset.u,true)});
  syncTree(true);
}
function syncTree(colors){
  document.querySelectorAll(".unit").forEach(r=>{const u=+r.dataset.u; r.classList.toggle("sel",u===selected);
    const cb=r.querySelector("input"); cb.checked=!hidden.has(u); r.style.opacity=units[u]&&units[u].visible?1:.45});
  document.querySelectorAll(".phase-h input").forEach(cb=>{const us=[...cb.closest(".phase").querySelectorAll(".unit")].map(r=>+r.dataset.u);cb.checked=us.some(u=>!hidden.has(u));cb.indeterminate=us.some(u=>hidden.has(u))&&us.some(u=>!hidden.has(u))});
  if(colors) document.querySelectorAll("[data-c]").forEach(i=>{if(!i.classList.contains("neg")) i.style.background=colorFor(+i.dataset.c)});
}
$("q").addEventListener("input",()=>{const v=$("q").value.trim().toLowerCase();
  document.querySelectorAll(".unit").forEach(r=>{const u=r.dataset.u;r.hidden=v&&!(u.includes(v)||defOf(+u).toLowerCase().includes(v)||catOf(+u).toLowerCase().includes(v))});
  document.querySelectorAll(".phase").forEach(p=>p.hidden=![...p.querySelectorAll(".unit")].some(r=>!r.hidden))});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){const r=[...document.querySelectorAll(".unit")].find(r=>!r.hidden); if(r) select(+r.dataset.u,true)}});
$("btnAll").onclick=()=>{hidden.clear();isolated=false;EXC=0;$("exc").value=0;updateVisibility();renderScheda()};

function buildLegend(){

  if(mode==="fase") L.innerHTML="<h4>Fasi</h4>"+D.fasi.slice().reverse().map(f=>`<div><i style="background:${PH_COL[f.Fase]}"></i>${f.Fase} · ${esc(f.Titolo)}</div>`).join("");

  return rows.length?`<dl class="rel">${rows.join("")}</dl>`:`<p class="muted">Nessun rapporto registrato.</p>`;

function matHTML(u){

function qualTxt(s){ const q=s._qualita; if(!q) return "—";
  if(q.strategia&&q.strategia!=="misurata") return AFF_TXT[q.strategia]+(q.quote_stimate?` (${q.quote_stimate} punti stimati)`:"");

function renderScheda(){
  const P=$("pScheda");
  if(selected==null){
    const nU=Object.keys(S).length, nm=D.materiali.reduce((s,m)=>s+(m.NR||0),0);
    P.innerHTML=`<div class="empty"><p style="font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px">${D.demo?"Scavo immaginario · ":""}${esc(ORIG.crs||"coordinate locali")}</p>

// ------------------------------------------------------------ selezione / camera
function select(u,focus){
  selected=u; highlight();
  if(u!=null){ if(hidden.has(u)) hidden.delete(u); if(removedAt(u)){EXC=TOPD[u];$("exc").value=EXC} }
  if(isolated && u==null) isolated=false;
  updateVisibility(); renderScheda(); renderHarrisSel(); renderSezSel();
  if(u!=null){ showPanel(true); switchTab("tScheda"); if(focus) focusUnit(u); }
  const r=document.querySelector(`.unit[data-u="${u}"]`); if(r) r.scrollIntoView({block:"nearest"});
}
let anim=null;
function flyTo(target,pos){
  const t0=performance.now(), a0=controls.target.clone(), p0=camera.position.clone();
  anim=t=>{let k=Math.min(1,(t-t0)/650); k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    controls.target.lerpVectors(a0,target,k); camera.position.lerpVectors(p0,pos,k); if(k>=1) anim=null};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){controls.target.copy(target);camera.position.copy(pos);anim=null}
}
function focusUnit(u){
  const U=units[u]; if(!U) return;
  const box=new THREE.Box3().setFromObject(U.front);
  const c=box.getCenter(new THREE.Vector3()), r=Math.max(1.2,box.getSize(new THREE.Vector3()).length()*.8);
  const dir=camera.position.clone().sub(controls.target).normalize();
  flyTo(c,c.clone().add(dir.multiplyScalar(r*3.2)));
}
function focusRS(id){
  let obj=null; Object.values(units).forEach(U=>U.extra.forEach(o=>{if(o.userData.rs===id) obj=o}));
  if(!obj) return; $("oRS").setAttribute("aria-pressed","true"); overlayToggle();
  const p=obj.getWorldPosition(new THREE.Vector3()); const dir=camera.position.clone().sub(controls.target).normalize();
  flyTo(p,p.clone().add(dir.multiplyScalar(3.2)));
  const s=obj.scale.x; let n=0; const pulse=setInterval(()=>{obj.scale.setScalar(n%2?s:s*2.2); if(++n>6){clearInterval(pulse);obj.scale.setScalar(s)}},180);
}
function viewFor(){
  const box=new THREE.Box3(); Object.values(units).forEach(U=>{if(U.grp.visible) box.expandByObject(U.front)});
  if(box.isEmpty()) box.set(new THREE.Vector3(-10,0,-8),new THREE.Vector3(10,3,8));
  const c=box.getCenter(new THREE.Vector3()), sz=box.getSize(new THREE.Vector3());
  // scavi piccoli: inquadratura larga come nel prototipo; aree grandi: più vicini (la vista obliqua le accorcia)
  const k=Math.max(sz.x,sz.z)>60?1.05:1.5;
  const R=Math.max(sz.x,sz.z*1.1,sz.y*1.6)*.5, d=R/Math.tan(camera.fov*Math.PI/360)*k/Math.pow(Math.min(1,camera.aspect),0.7);
  const top=$("vtop").getAttribute("aria-pressed")==="true";
  const dir=top?new THREE.Vector3(0,1,0.001):new THREE.Vector3(-.5,.36,.8);
  return [c, c.clone().add(dir.normalize().multiplyScalar(d))];
}
function home(){ const [t,p]=viewFor(); flyTo(t,p) }

// ------------------------------------------------------------ picking
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function pick(ev){
  const r=canvas.getBoundingClientRect();
  mouse.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const objs=Object.values(units).filter(U=>U.grp.visible).map(U=>U.front);
  const hits=ray.intersectObjects(objs,false);
  for(const h of hits){ if(clipOn && clipPlane.distanceToPoint(h.point)<0) continue;
    const id=h.object.userData.id; if(units[id].cut && hits.some(o=>!units[o.object.userData.id].cut && o.distance<h.distance+0.5)) continue; return id }
  return null;
}
let down=null;
canvas.addEventListener("pointerdown",e=>{down=[e.clientX,e.clientY]});
canvas.addEventListener("pointerup",e=>{ if(!down) return; const d=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; if(d<5) select(pick(e),false) });
const tip=$("tip");
canvas.addEventListener("pointermove",e=>{ if(e.buttons) {tip.hidden=true;return}
  const id=pick(e); if(id==null){tip.hidden=true;canvas.style.cursor="";return}
  const r=stage.getBoundingClientRect(); tip.hidden=false; tip.style.left=(e.clientX-r.left)+"px"; tip.style.top=(e.clientY-r.top)+"px";
  tip.textContent=(S[id]._tipo==="USM"?"USM ":"US ")+id+" · "+defOf(id); canvas.style.cursor="pointer"});
canvas.addEventListener("pointerleave",()=>tip.hidden=true);

const labEl={};
Object.entries(units).forEach(([u,U])=>{const d=document.createElement("div");d.className="lbl";d.textContent=(S[u]?._tipo==="USM"?"USM ":"")+u;$("labels").appendChild(d);labEl[u]=d});
const tmpV=new THREE.Vector3();
function drawLabels(){
  const on=$("oLbl").getAttribute("aria-pressed")==="true";
  const w=canvas.clientWidth,h=canvas.clientHeight;
  const placed=[];
  const order=Object.entries(units).sort((a,b)=>(+b[0]===selected)-(+a[0]===selected));
  order.forEach(([u,U])=>{
    const el=labEl[u];
    if(!on||!U.grp.visible){el.style.display="none";return}
    const L=U.def.label; tmpV.set(L[0]-CX,L[2]*VE+U.grp.position.y,-(L[1]-CY));
    if(clipOn && clipPlane.distanceToPoint(tmpV)<0){el.style.display="none";return}
    tmpV.project(camera);
    if(tmpV.z>1){el.style.display="none";return}
    const px=(tmpV.x+1)/2*w, py=(1-tmpV.y)/2*h;
    if(placed.some(([x,y])=>Math.abs(x-px)<46&&Math.abs(y-py)<17)){el.style.display="none";return}
    placed.push([px,py]);
    el.style.display=""; el.style.left=px+"px"; el.style.top=py+"px";
    el.classList.toggle("sel",+u===selected);
  });
}

let clipSign=1;
// intervallo iniziale largo per entrambi gli assi: impostare il valore prima di scegliere l'asse non lo tronca
$("clipPos").min=Math.floor(Math.min(EXT[0],EXT[1])); $("clipPos").max=Math.ceil(Math.max(EXT[2],EXT[3])); $("clipPos").value=CX;
function setClip(){
  const ax=$("clipAx").value; clipOn=!!ax;
  const pos=+$("clipPos").value;
  if(ax==="x"){ $("clipPos").min=Math.floor(EXT[0]); $("clipPos").max=Math.ceil(EXT[2]); clipPlane.normal.set(-clipSign,0,0); clipPlane.constant=clipSign*(pos-CX); $("clipO").textContent="x "+num(pos,2); }
  else if(ax==="y"){ $("clipPos").min=Math.floor(EXT[1]); $("clipPos").max=Math.ceil(EXT[3]); clipPlane.normal.set(0,0,clipSign); clipPlane.constant=-clipSign*(CY-pos); $("clipO").textContent="y "+num(pos,2); }
  else $("clipO").textContent="";
  applyClip(); highlight();
}
function sectionPreset(name){
  const s=D.sezioni.find(x=>x.nome===name); if(!s) return;
  GAP=0; $("expl").value=0; $("explO").textContent="0 cm"; applyLayout();
  const ns=Math.abs(s.a[0]-s.b[0])<Math.abs(s.a[1]-s.b[1]);
  $("clipAx").value=ns?"x":"y"; clipSign=1; $("clipPos").value=ns?s.a[0]:s.a[1]; setClip();
  const cy=1.3*VE; const t=ns?V(s.a[0],(s.a[1]+s.b[1])/2,0):V((s.a[0]+s.b[0])/2,s.a[1],0); t.y=cy;
  const p=t.clone(); if(ns) p.x+=23; else p.z-=23; p.y+=3.5;
  flyTo(t,p);
}

// ------------------------------------------------------------ Harris
function renderHarris(){
  const H=D.harris, W=56, Hh=24, gx=14, gy=22, pad=16;
  const w=pad*2+H.cols*(W+gx), h=pad*2+H.rows*(Hh+gy);
  const P={}; H.nodes.forEach(n=>P[n.id]=[pad+n.c*(W+gx),pad+n.r*(Hh+gy)]);
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Diagramma di Harris">`;
  H.edges.forEach(([a,b])=>{const [x1,y1]=P[a],[x2,y2]=P[b]; const my=(y1+Hh+y2)/2;
    s+=`<path class="hedge" d="M${x1+W/2},${y1+Hh} V${my} H${x2+W/2} V${y2}"/>`});
  H.same.forEach(([a,b])=>{const [x1,y1]=P[a],[x2,y2]=P[b]; s+=`<line class="hsame" x1="${x1+W/2}" y1="${y1+Hh/2}" x2="${x2+W/2}" y2="${y2+Hh/2}"/>`});
  H.nodes.forEach(n=>{const [x,y]=P[n.id]; const s_=S[n.id]; const neg=s_?.Tipo==="negativa", m=s_?._tipo==="USM";
    s+=`<g class="hnode" data-h="${n.id}" tabindex="0"><rect x="${x}" y="${y}" width="${W}" height="${Hh}" rx="${m?0:(neg?12:3)}" fill="${PH_COL[s_?.Fase??0]}" fill-opacity=".28" ${neg?'stroke-dasharray="3 2"':""}/><text x="${x+W/2}" y="${y+Hh/2+4}" text-anchor="middle">${m?"M ":""}${n.id}</text></g>`});
  s+="</svg>";
  $("pHarris").innerHTML=`<p class="note" style="margin-top:0">Rapporti diretti dopo la riduzione transitiva: dall'alto le unità più recenti. Bordo tratteggiato = US negativa, angoli vivi = USM, tratteggio orizzontale = unità legate. Colore = fase.</p><div class="hwrap">${s}</div>`;
  $("pHarris").querySelectorAll("[data-h]").forEach(g=>{g.onclick=()=>select(+g.dataset.h,true);g.onkeydown=e=>{if(e.key==="Enter")select(+g.dataset.h,true)}});
  renderHarrisSel();
}
function renderHarrisSel(){ document.querySelectorAll(".hnode").forEach(g=>g.classList.toggle("sel",+g.dataset.h===selected)) }

// ------------------------------------------------------------ Sezioni 2D (disegni del GIS)
function renderSez(){
  const names=[...new Set(D.sez_draw.map(p=>p.s))];
  const cur=$("pSez").dataset.cur||names[0];
  const polys=D.sez_draw.filter(p=>p.s===cur);
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9; polys.forEach(p=>{for(let i=0;i<p.c.length;i+=2){x0=Math.min(x0,p.c[i]);x1=Math.max(x1,p.c[i]);z0=Math.min(z0,p.c[i+1]);z1=Math.max(z1,p.c[i+1])}});
  const k=34, ve=2, pl=40, pt=10, W=(x1-x0)*k+pl+10, Hh=(z1-z0)*k*ve+pt+26;
  const X=x=>pl+(x-x0)*k, Y=z=>pt+(z1-z)*k*ve;
  let s=`<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Sezione ${esc(cur)}">`;
  for(let z=Math.ceil(z0*4)/4;z<=z1;z+=.25){s+=`<line class="axis" x1="${pl}" x2="${W-10}" y1="${Y(z)}" y2="${Y(z)}"/><text class="axt" x="${pl-4}" y="${Y(z)+3}" text-anchor="end">${z.toFixed(2)}</text>`}
  for(let x=Math.ceil(x0);x<=x1;x+=1){s+=`<text class="axt" x="${X(x)}" y="${Hh-8}" text-anchor="middle">${x}</text>`}
  polys.forEach(p=>{let d="";for(let i=0;i<p.c.length;i+=2)d+=(i?"L":"M")+X(p.c[i]).toFixed(1)+","+Y(p.c[i+1]).toFixed(1);
    const isM=S[p.us]?._tipo==="USM";
    s+=`<path class="spoly" data-s="${p.us}" d="${d}Z" fill="${colorFor(p.us)}" ${isM?'fill-opacity=".85"':""}><title>${isM?"USM ":"US "}${p.us} · ${esc(defOf(p.us))}</title></path>`});
  const done=new Set();
  polys.forEach(p=>{ if(done.has(p.us)) return; let best=null,ba=0;
    polys.filter(q=>q.us===p.us).forEach(q=>{let a=0;for(let i=0;i<q.c.length-2;i+=2)a+=q.c[i]*q.c[i+3]-q.c[i+2]*q.c[i+1];a=Math.abs(a/2);if(a>ba){ba=a;best=q}});
    if(ba<.02) return; done.add(p.us); let sx=0,sz=0,n=0; for(let i=0;i<best.c.length;i+=2){sx+=best.c[i];sz+=best.c[i+1];n++}
    s+=`<text class="slbl" x="${X(sx/n)}" y="${Y(sz/n)+3}" text-anchor="middle">${p.us}</text>`});
  s+="</svg>";
  $("pSez").innerHTML=`<div class="row"><label for="sezSel">Sezione</label><select id="sezSel">${names.map(n=>`<option ${n===cur?"selected":""}>${esc(n)}</option>`).join("")}</select><button class="hbtn" id="sez3d">Mostra nel 3D</button></div>
    <p class="note" style="margin-top:0">Disegno di sezione dal layer <i>sezioni_disegno</i> del GIS, esagerazione verticale ×2. Clic su un'unità per aprirne la scheda.</p><div class="hwrap">${s}</div>`;
  $("sezSel").onchange=e=>{$("pSez").dataset.cur=e.target.value;renderSez()};
  $("sez3d").onclick=()=>sectionPreset(cur);
  $("pSez").querySelectorAll("[data-s]").forEach(p=>p.onclick=()=>select(+p.dataset.s,false));
  renderSezSel();
}

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratigrafia3d"
version = "0.9.2"
description = "3D reconstruction of archaeological stratigraphic units from 2D excavation records (GIS + spreadsheets)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [{name = "Sebastiano Trabucchi"}]
keywords = ["archaeology", "stratigraphy", "Harris matrix", "3D", "GIS", "excavation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
  "Natural Language :: Italian",
  "Natural Language :: English",
]

dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "geopandas>=0.14", "pyogrio>=0.7",
  "shapely>=2.0", "networkx>=3.0", "openpyxl>=3.1", "tifffile>=2023.1", "pillow>=9",
  "triangle>=20230923; python_version < '3.14'",   # facoltativa: senza, si usa la triangolazione scipy
]

[project.urls]
Repository = "https://github.com/MoJoDoD/3Dstratigraphy-app-development"
Issues = "https://github.com/MoJoDoD/3Dstratigraphy-app-development/issues"

[project.optional-dependencies]
demo = ["scikit-image>=0.22", "matplotlib>=3.8"]
app = ["pywebview>=5", "scikit-image>=0.22", "matplotlib>=3.8"]
test = ["pytest>=8", "scikit-image>=0.22", "matplotlib>=3.8", "ezdxf>=1.1"]

[project.scripts]
strat3d = "stratigrafia3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stratigrafia3d.visualizzatore" = ["*.html"]
"stratigrafia3d.ricette" = ["*.json"]
"stratigrafia3d.lingue" = ["*.json"]
"stratigrafia3d.app" = ["statici/*.html", "statici/vendor/*", "statici/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*non conformant file extension", "ignore:.*Axes3D", "ignore:.*crs. was not provided"]
